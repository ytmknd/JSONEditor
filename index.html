<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON Editor</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #6b7280; --border: #d0d7de; --panel: #f6f8fa;
    --accent: #2563eb; --hit: #fde68a; --cur: #fb923c; --err: #dc2626;
    --key: #7c3aed; --str: #15803d; --num: #b45309; --bool: #0369a1; --null: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --border: #30363d; --panel: #161b22;
      --accent: #58a6ff; --hit: #5b4a00; --cur: #9a4b00; --err: #f85149;
      --key: #d2a8ff; --str: #7ee787; --num: #ffa657; --bool: #79c0ff; --null: #8b949e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, "Segoe UI", "Yu Gothic UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  button, select, input[type=search], input[type=text], input[type=number] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  .sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
  .search { display: flex; gap: 4px; align-items: center; }
  .search input[type=search] { width: 220px; }
  #count { color: var(--muted); min-width: 64px; font-variant-numeric: tabular-nums; }
  label.chk { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
  .tabs { display: flex; gap: 0; }
  .tabs button { border-radius: 0; }
  .tabs button:first-child { border-radius: 6px 0 0 6px; }
  .tabs button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #status { padding: 4px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); min-height: 26px; }
  #status.err { color: var(--err); }
  main { flex: 1; min-height: 0; position: relative; }
  #tree, #textWrap { position: absolute; inset: 0; }
  #tree { overflow: auto; padding: 8px 12px 40px; font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; font-size: 13px; }
  /* Syntax highlighting: a <pre> paints the colored text under a transparent textarea. */
  #text, #hl { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border: 0; padding: 12px; font: 13px/1.5 ui-monospace, Consolas, "Cascadia Mono", monospace; tab-size: 2; white-space: pre; letter-spacing: 0; }
  #text { resize: none; outline: none; background: transparent; color: transparent; caret-color: var(--fg); overflow: auto; }
  #text::placeholder { color: var(--muted); }
  #hl { overflow: hidden; pointer-events: none; color: var(--fg); background: var(--bg); }
  #textWrap.plain #text { color: var(--fg); background: var(--bg); }
  #textWrap.plain #hl { display: none; }
  .tk { color: var(--key); } .ts { color: var(--str); } .tn { color: var(--num); } .tb { color: var(--bool); } .tz { color: var(--null); font-style: italic; }
  .tp { color: var(--muted); }
  .hidden { display: none !important; }
  .row { display: flex; align-items: baseline; gap: 4px; padding: 1px 0; border-radius: 4px; white-space: nowrap; }
  .row:hover { background: var(--panel); }
  .row .acts { visibility: hidden; margin-left: 8px; display: inline-flex; gap: 2px; }
  .row:hover .acts, .row:focus-within .acts { visibility: visible; }
  .acts button, .acts select { padding: 0 6px; font-size: 11px; line-height: 18px; }
  .children { margin-left: 18px; padding-left: 10px; border-left: 1px dotted var(--border); }
  .tog { width: 14px; text-align: center; cursor: pointer; color: var(--muted); user-select: none; flex: none; }
  .k { color: var(--key); cursor: text; }
  .colon { color: var(--muted); }
  .v { cursor: text; }
  .v.string { color: var(--str); }
  .v.number { color: var(--num); }
  .v.boolean { color: var(--bool); cursor: pointer; }
  .v.null { color: var(--null); font-style: italic; }
  .sum { color: var(--muted); }
  mark { background: var(--hit); color: inherit; border-radius: 2px; }
  mark.cur { background: var(--cur); }
  .row.cur-row { outline: 1px solid var(--cur); }
  .edit { font-family: inherit; font-size: inherit; padding: 0 4px; min-width: 60px; }
  .empty { color: var(--muted); padding: 24px; }
</style>
</head>
<body>
<header>
  <h1>JSON Editor</h1>
  <button id="open" data-i18n="open">Open</button>
  <input type="file" id="file" class="hidden">
  <button id="save" data-i18n="save">Save</button>
  <button id="copy" data-i18n="copy">Copy</button>
  <button id="selAll" data-i18n="selAll" data-i18n-title="selAllT" title="Select the whole document">Select all</button>
  <span class="sep"></span>
  <button id="undo" title="Ctrl+Z" data-i18n="undo">Undo</button>
  <button id="redo" title="Ctrl+Y" data-i18n="redo">Redo</button>
  <span class="sep"></span>
  <select id="indent" title="Indent" data-i18n-title="indentT">
    <option value="2" data-i18n="sp2">2 spaces</option>
    <option value="4" data-i18n="sp4">4 spaces</option>
    <option value="tab" data-i18n="tab">Tab</option>
  </select>
  <button id="format" data-i18n="format">Format</button>
  <button id="minify" data-i18n="minify">Minify</button>
  <label class="chk"><input type="checkbox" id="sortKeys"><span data-i18n="sortKeys">Sort keys</span></label>
  <span class="sep"></span>
  <div class="tabs">
    <button id="tabTree" class="on" data-i18n="tabTree">Tree</button>
    <button id="tabText" data-i18n="tabText">Text</button>
  </div>
  <span class="sep"></span>
  <div class="search">
    <input type="search" id="q" placeholder="Search (Enter for next)" data-i18n-ph="qPh">
    <button id="prev" title="Shift+Enter">▲</button>
    <button id="next" title="Enter">▼</button>
    <span id="count"></span>
    <label class="chk"><input type="checkbox" id="optKey" checked><span data-i18n="optKey">Keys</span></label>
    <label class="chk"><input type="checkbox" id="optVal" checked><span data-i18n="optVal">Values</span></label>
    <label class="chk"><input type="checkbox" id="optCase"><span data-i18n="optCase">Match case</span></label>
    <label class="chk"><input type="checkbox" id="optRe"><span data-i18n="optRe">Regex</span></label>
  </div>
</header>
<div id="status"></div>
<main>
  <div id="tree"></div>
  <div id="textWrap" class="hidden">
    <pre id="hl" aria-hidden="true"></pre>
    <textarea id="text" spellcheck="false" placeholder="Paste JSON here" data-i18n-ph="textPh"></textarea>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // ---------- i18n: Japanese for ja browsers, English otherwise ----------
  const MESSAGES = {
    en: {
      open: 'Open', save: 'Save', copy: 'Copy', selAll: 'Select all', selAllT: 'Select the whole document',
      undo: 'Undo', redo: 'Redo', indentT: 'Indent', sp2: '2 spaces', sp4: '4 spaces', tab: 'Tab',
      format: 'Format', minify: 'Minify', sortKeys: 'Sort keys', tabTree: 'Tree', tabText: 'Text',
      qPh: 'Search (Enter for next)', optKey: 'Keys', optVal: 'Values', optCase: 'Match case', optRe: 'Regex',
      textPh: 'Paste JSON here',
      emptyDoc: 'Empty document. Use "Open" to load a file, or paste JSON in the "Text" tab.',
      renameKeyT: 'Double-click to rename key', collapsedN: n => `… ${n} ${n === 1 ? 'item' : 'items'}`,
      add: '+ Add', toggleT: 'Click to toggle', editT: 'Click to edit', del: 'Delete',
      keyExists: k => `Key "${k}" already exists`, badNumber: 'Not a valid number',
      reErr: m => `Regex error: ${m}`, noHits: '0 hits',
      pos: (l, c) => ` (line ${l}, col ${c})`, jsonErr: m => `JSON error: ${m}`, validJson: 'OK: valid JSON',
      noFmt: 'No JSON to format', noMin: 'No JSON to minify', minDone: 'Minified (it will be formatted again when you go back to the tree)',
      fileJsonErr: (f, m) => `${f}: JSON error: ${m}`, opened: f => `Opened ${f}`, saved: f => `Saved ${f}`,
      filePrompt: 'File name (extension optional)', noSave: 'No JSON to save', noCopy: 'No JSON to copy', copied: 'Copied'
    },
    ja: {
      open: '開く', save: '保存', copy: 'コピー', selAll: '全選択', selAllT: 'ドキュメント全体を選択',
      undo: '元に戻す', redo: 'やり直し', indentT: 'インデント', sp2: 'スペース2', sp4: 'スペース4', tab: 'タブ',
      format: '整形', minify: '圧縮', sortKeys: 'キー順に並べる', tabTree: 'ツリー', tabText: 'テキスト',
      qPh: '検索 (Enterで次へ)', optKey: 'キー', optVal: '値', optCase: '大小区別', optRe: '正規表現',
      textPh: 'ここにJSONを貼り付け',
      emptyDoc: '空のドキュメントです。「開く」でファイルを読み込むか、「テキスト」タブにJSONを貼り付けてください。',
      renameKeyT: 'ダブルクリックでキー名を変更', collapsedN: n => `… ${n}件`,
      add: '＋追加', toggleT: 'クリックで切替', editT: 'クリックで編集', del: '削除',
      keyExists: k => `キー "${k}" は既に存在します`, badNumber: '数値として解釈できません',
      reErr: m => `正規表現エラー: ${m}`, noHits: '0件',
      pos: (l, c) => `(行 ${l}, 列 ${c})`, jsonErr: m => `JSONエラー: ${m}`, validJson: 'OK: 有効なJSON',
      noFmt: '整形するJSONがありません', noMin: '圧縮するJSONがありません', minDone: '圧縮しました(ツリーに戻ると整形されます)',
      fileJsonErr: (f, m) => `${f}: JSONエラー: ${m}`, opened: f => `${f} を開きました`, saved: f => `${f} を保存しました`,
      filePrompt: 'ファイル名(拡張子なしも可)', noSave: '保存するJSONがありません', noCopy: 'コピーするJSONがありません', copied: 'コピーしました'
    }
  };
  const lang = /^ja\b/i.test(navigator.language || '') ? 'ja' : 'en';
  const t = (key, ...args) => { const m = MESSAGES[lang][key]; return typeof m === 'function' ? m(...args) : m; };
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-title]')) el.title = t(el.dataset.i18nTitle);
  for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = t(el.dataset.i18nPh);
  let reErr = false;                    // a regex error is currently shown in the status bar
  const treeEl = $('tree'), textEl = $('text'), statusEl = $('status');
  const textWrap = $('textWrap'), hlEl = $('hl');

  // Colorize the text view. Very large documents fall back to plain text to stay responsive.
  const TOKEN = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|[{}\[\],:]/g;
  function paintText() {
    const src = textEl.value;
    const plain = src.length > 1000000;
    textWrap.classList.toggle('plain', plain);
    if (plain) return;
    let out = '', last = 0, m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(src))) {
      out += esc(src.slice(last, m.index));
      const cls = m[1] ? (m[2] ? 'tk' : 'ts') : m[3] ? 'tb' : m[0] === 'null' ? 'tz' : /^[-\d]/.test(m[0]) ? 'tn' : 'tp';
      out += m[1] && m[2] ? `<span class="tk">${esc(m[1])}</span><span class="tp">${esc(m[2])}</span>` : `<span class="${cls}">${esc(m[0])}</span>`;
      last = TOKEN.lastIndex;
    }
    hlEl.innerHTML = out + esc(src.slice(last)) + '\n';
    syncScroll();
  }
  function syncScroll() { hlEl.scrollTop = textEl.scrollTop; hlEl.scrollLeft = textEl.scrollLeft; }
  textEl.addEventListener('scroll', syncScroll);

  let data = null;
  let empty = true;                     // blank document (no JSON loaded yet)
  let fileName = 'data.json';
  const collapsed = new Set();          // key(path) of collapsed nodes
  let hits = [], hitIdx = -1;           // search results: [{path, inKey, inVal}]
  let undoStack = [], redoStack = [];
  let view = 'tree';
  let textDirty = false;

  const pk = p => JSON.stringify(p);
  const typeOf = v => v === null ? 'null' : Array.isArray(v) ? 'array' : typeof v;
  const isCont = v => v !== null && typeof v === 'object';
  const getIndent = () => { const v = $('indent').value; return v === 'tab' ? '\t' : Number(v); };
  const serialize = (v, indent = getIndent()) => JSON.stringify(v, null, indent);
  const docText = indent => empty ? '' : serialize(data, indent);
  const getAt = path => path.reduce((o, k) => o[k], data);

  function setStatus(msg, isErr) { statusEl.textContent = msg || ''; statusEl.className = isErr ? 'err' : ''; }

  // ---------- history ----------
  function snapshot() { return JSON.stringify({ e: empty, d: data }); }
  function commit(mutate) {
    undoStack.push(snapshot()); if (undoStack.length > 200) undoStack.shift();
    redoStack = [];
    mutate();
    afterChange();
  }
  function restore(s) { const o = JSON.parse(s); empty = o.e; data = o.d; afterChange(); }
  function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); }
  function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); }
  function afterChange() {
    textEl.value = docText(); textDirty = false; paintText();
    renderTree(); runSearch(true); updateButtons();
    setStatus('');
  }
  function updateButtons() { $('undo').disabled = !undoStack.length; $('redo').disabled = !redoStack.length; }

  // ---------- tree ----------
  function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

  // Returns HTML with <mark> around the match ranges for this text.
  function hl(text, ranges, cls) {
    if (!ranges || !ranges.length) return esc(text);
    let out = '', last = 0;
    for (const [s, e] of ranges) { out += esc(text.slice(last, s)) + `<mark${cls ? ' class="cur"' : ''}>` + esc(text.slice(s, e)) + '</mark>'; last = e; }
    return out + esc(text.slice(last));
  }

  const hitMap = new Map(); // pk(path) -> {key:[ranges], val:[ranges]}

  function renderTree() {
    treeEl.textContent = '';
    if (empty) {
      const d = document.createElement('div'); d.className = 'empty';
      d.textContent = t('emptyDoc');
      treeEl.appendChild(d); return;
    }
    treeEl.appendChild(buildNode(data, [], null));
    const cur = treeEl.querySelector('.cur-row');
    if (cur) cur.scrollIntoView({ block: 'center' });
  }

  function valText(v) { return typeof v === 'string' ? v : String(v); }

  function buildNode(v, path, key) {
    const wrap = document.createElement('div');
    const row = document.createElement('div');
    row.className = 'row';
    const id = pk(path);
    row.dataset.path = id;
    const hm = hitMap.get(id);
    if (hitIdx >= 0 && hits[hitIdx] && pk(hits[hitIdx].path) === id) row.classList.add('cur-row');
    const parentIsArr = path.length && Array.isArray(getAt(path.slice(0, -1)));

    const tog = document.createElement('span'); tog.className = 'tog';
    row.appendChild(tog);

    if (key !== null) {
      const k = document.createElement('span'); k.className = 'k';
      k.innerHTML = parentIsArr ? esc(String(key)) : hl(String(key), hm && hm.key, hits[hitIdx] && pk(hits[hitIdx].path) === id);
      if (!parentIsArr) { k.title = t('renameKeyT'); k.ondblclick = () => editKey(k, path); }
      else k.style.color = 'var(--muted)';
      row.appendChild(k);
      const c = document.createElement('span'); c.className = 'colon'; c.textContent = ':'; row.appendChild(c);
    }

    const acts = document.createElement('span'); acts.className = 'acts';

    if (isCont(v)) {
      const arr = Array.isArray(v);
      const keys = Object.keys(v);
      const isCol = collapsed.has(id);
      tog.textContent = isCol ? '▶' : '▼';
      tog.onclick = () => { isCol ? collapsed.delete(id) : collapsed.add(id); renderTree(); };
      const open = document.createElement('span'); open.className = 'sum';
      open.textContent = (arr ? '[' : '{') + (isCol ? ` ${t('collapsedN', keys.length)} ${arr ? ']' : '}'}` : (keys.length ? '' : arr ? ']' : '}'));
      row.appendChild(open);
      const add = document.createElement('button'); add.textContent = t('add'); add.onclick = () => addChild(path);
      acts.appendChild(add);
    } else {
      tog.textContent = '';
      const span = document.createElement('span');
      const t = typeOf(v);
      span.className = 'v ' + t;
      const isCur = hits[hitIdx] && pk(hits[hitIdx].path) === id;
      if (t === 'string') span.innerHTML = '"' + hl(v, hm && hm.val, isCur) + '"';
      else span.innerHTML = hl(valText(v), hm && hm.val, isCur);
      if (t === 'boolean') { span.title = t('toggleT'); span.onclick = () => commit(() => setAt(path, !v)); }
      else if (t !== 'null') { span.title = t('editT'); span.onclick = () => editValue(span, path, v); }
      row.appendChild(span);
    }

    // type selector
    const sel = document.createElement('select');
    for (const t of ['string', 'number', 'boolean', 'null', 'object', 'array']) {
      const o = document.createElement('option'); o.value = t; o.textContent = t; sel.appendChild(o);
    }
    sel.value = typeOf(v) === 'object' ? 'object' : typeOf(v);
    sel.onchange = () => commit(() => setAt(path, convert(v, sel.value)));
    acts.appendChild(sel);
    if (path.length) {
      const del = document.createElement('button'); del.textContent = '✕'; del.title = t('del');
      del.onclick = () => commit(() => removeAt(path));
      acts.appendChild(del);
    }
    row.appendChild(acts);
    wrap.appendChild(row);

    if (isCont(v)) {
      const keys = Object.keys(v);
      if (!collapsed.has(id) && keys.length) {
        const ch = document.createElement('div'); ch.className = 'children';
        for (const k of keys) ch.appendChild(buildNode(v[k], path.concat(Array.isArray(v) ? Number(k) : k), Array.isArray(v) ? Number(k) : k));
        wrap.appendChild(ch);
        const close = document.createElement('div'); close.className = 'sum';
        close.style.paddingLeft = '18px'; close.textContent = Array.isArray(v) ? ']' : '}';
        wrap.appendChild(close);
      }
    }
    return wrap;
  }

  function convert(v, t) {
    const s = isCont(v) ? '' : String(v ?? '');
    switch (t) {
      case 'string': return isCont(v) ? serialize(v, 0) : s === 'null' ? '' : s;
      case 'number': { const n = Number(s); return Number.isFinite(n) && s.trim() !== '' ? n : 0; }
      case 'boolean': return s === 'true';
      case 'null': return null;
      case 'object': return {};
      case 'array': return [];
    }
  }

  function setAt(path, val) {
    if (!path.length) { data = val; return; }
    getAt(path.slice(0, -1))[path[path.length - 1]] = val;
  }
  function removeAt(path) {
    const parent = getAt(path.slice(0, -1)), k = path[path.length - 1];
    Array.isArray(parent) ? parent.splice(k, 1) : delete parent[k];
  }
  function addChild(path) {
    const c = getAt(path);
    if (Array.isArray(c)) { commit(() => c.push('')); collapsed.delete(pk(path)); renderTree(); return; }
    let name = 'key', i = 1;
    while (name in c) name = 'key' + (++i);
    commit(() => { c[name] = ''; });
    collapsed.delete(pk(path)); renderTree();
    const row = [...treeEl.querySelectorAll('.row')].find(r => r.dataset.path === pk(path.concat(name)));
    if (row) editKey(row.querySelector('.k'), path.concat(name));
  }

  function inlineInput(el, initial, onDone, type = 'text') {
    const inp = document.createElement('input');
    inp.type = type; inp.value = initial; inp.className = 'edit';
    inp.style.width = Math.max(80, initial.length * 8 + 30) + 'px';
    el.replaceWith(inp); inp.focus(); inp.select();
    let done = false;
    const finish = ok => { if (done) return; done = true; ok ? onDone(inp.value) : renderTree(); };
    inp.onkeydown = e => { if (e.key === 'Enter') finish(true); else if (e.key === 'Escape') finish(false); e.stopPropagation(); };
    inp.onblur = () => finish(true);
  }

  function editKey(el, path) {
    const parent = getAt(path.slice(0, -1)), old = String(path[path.length - 1]);
    inlineInput(el, old, nv => {
      if (nv === old) return renderTree();
      if (nv in parent) { setStatus(t('keyExists', nv), true); return renderTree(); }
      commit(() => { // rename while preserving order
        const entries = Object.entries(parent).map(([k, v]) => [k === old ? nv : k, v]);
        for (const k of Object.keys(parent)) delete parent[k];
        for (const [k, v] of entries) parent[k] = v;
      });
    });
  }

  function editValue(el, path, v) {
    const isNum = typeof v === 'number';
    inlineInput(el, String(v), nv => {
      if (isNum) {
        const n = Number(nv);
        if (nv.trim() === '' || !Number.isFinite(n)) { setStatus(t('badNumber'), true); return renderTree(); }
        commit(() => setAt(path, n));
      } else commit(() => setAt(path, nv));
    });
  }

  // ---------- search ----------
  function makeMatcher() {
    const q = $('q').value;
    if (!q) return null;
    const flags = 'g' + ($('optCase').checked ? '' : 'i');
    try {
      return new RegExp($('optRe').checked ? q : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags);
    } catch (e) { reErr = true; setStatus(t('reErr', e.message), true); return undefined; }
  }
  function findRanges(text, re) {
    const out = []; re.lastIndex = 0; let m;
    while ((m = re.exec(text))) { if (m[0] === '') { re.lastIndex++; continue; } out.push([m.index, m.index + m[0].length]); }
    return out;
  }

  function runSearch(keep) {
    const prevKey = keep && hits[hitIdx] ? pk(hits[hitIdx].path) : null;
    hits = []; hitMap.clear(); hitIdx = -1;
    if (reErr) { reErr = false; setStatus(''); }
    const re = empty ? null : makeMatcher();
    if (re === null) { $('count').textContent = ''; renderTree(); return; }
    if (re === undefined) { $('count').textContent = ''; return; }
    const useK = $('optKey').checked, useV = $('optVal').checked;
    (function walk(v, path) {
      const entry = {};
      const last = path[path.length - 1];
      if (useK && path.length && !Array.isArray(getAt(path.slice(0, -1)))) { const r = findRanges(String(last), re); if (r.length) entry.key = r; }
      if (useV && !isCont(v)) { const r = findRanges(valText(v), re); if (r.length) entry.val = r; }
      if (entry.key || entry.val) { hitMap.set(pk(path), entry); hits.push({ path }); }
      if (isCont(v)) for (const k of Object.keys(v)) walk(v[k], path.concat(Array.isArray(v) ? Number(k) : k));
    })(data, []);
    if (hits.length) {
      hitIdx = Math.max(0, prevKey ? hits.findIndex(h => pk(h.path) === prevKey) : 0);
      revealHit();
    }
    $('count').textContent = $('q').value ? (hits.length ? `${hitIdx + 1} / ${hits.length}` : t('noHits')) : '';
    renderTree();
  }
  function revealHit() { // expand ancestors of current hit
    const p = hits[hitIdx].path;
    for (let i = 0; i < p.length; i++) collapsed.delete(pk(p.slice(0, i)));
  }
  function step(d) {
    if (!hits.length) return;
    hitIdx = (hitIdx + d + hits.length) % hits.length;
    revealHit();
    $('count').textContent = `${hitIdx + 1} / ${hits.length}`;
    if (view === 'text') showTree();
    renderTree();
  }

  // ---------- text view / io ----------
  function parseText(src) {
    try { return { ok: true, value: JSON.parse(src) }; }
    catch (e) {
      let msg = e.message;
      const m = /position (\d+)/.exec(msg);
      if (m) { const pos = +m[1], before = src.slice(0, pos).split('\n'); msg += t('pos', before.length, before[before.length - 1].length + 1); }
      return { ok: false, message: msg };
    }
  }
  function applyText() { // textarea -> data
    if (!textDirty) return true;
    const blank = textEl.value.trim() === '';
    const r = blank ? { ok: true, value: null } : parseText(textEl.value);
    if (!r.ok) { setStatus(t('jsonErr', r.message), true); return false; }
    undoStack.push(snapshot()); redoStack = [];
    data = r.value; empty = blank; textDirty = false;
    renderTree(); runSearch(false); updateButtons();
    setStatus('');
    return true;
  }
  textEl.addEventListener('input', () => {
    textDirty = true; paintText();
    if (textEl.value.trim() === '') return setStatus('');
    const r = parseText(textEl.value);
    setStatus(r.ok ? t('validJson') : t('jsonErr', r.message), !r.ok);
  });

  function showTree() { if (!applyText()) return; view = 'tree'; treeEl.classList.remove('hidden'); textWrap.classList.add('hidden'); $('tabTree').classList.add('on'); $('tabText').classList.remove('on'); }
  function showText() { view = 'text'; textWrap.classList.remove('hidden'); treeEl.classList.add('hidden'); $('tabText').classList.add('on'); $('tabTree').classList.remove('on'); textEl.focus(); syncScroll(); }
  $('tabTree').onclick = showTree;
  $('tabText').onclick = showText;

  function sortDeep(v) {
    if (Array.isArray(v)) return v.map(sortDeep);
    if (isCont(v)) return Object.fromEntries(Object.keys(v).sort().map(k => [k, sortDeep(v[k])]));
    return v;
  }
  $('format').onclick = () => {
    if (!applyText()) return;
    if (empty) return setStatus(t('noFmt'));
    commit(() => { if ($('sortKeys').checked) data = sortDeep(data); });
  };
  $('indent').onchange = () => { textEl.value = docText(); paintText(); };
  $('minify').onclick = () => {
    if (!applyText()) return;
    if (empty) return setStatus(t('noMin'));
    textEl.value = serialize(data, 0); textDirty = false; paintText(); showText();
    setStatus(t('minDone'));
  };

  $('open').onclick = () => $('file').click();
  $('file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const r = parseText(await f.text());
    e.target.value = '';
    if (!r.ok) { setStatus(t('fileJsonErr', f.name, r.message), true); return; }
    undoStack.push(snapshot()); redoStack = [];
    data = r.value; empty = false; fileName = f.name; collapsed.clear();
    afterChange(); setStatus(t('opened', f.name));
  };
  // Save under any name (extensionless included): native picker where available, else prompt + download.
  async function saveFile(raw) {
    if (window.showSaveFilePicker) {
      try {
        const h = await showSaveFilePicker({ suggestedName: fileName });
        const w = await h.createWritable(); await w.write(raw); await w.close();
        fileName = h.name; setStatus(t('saved', h.name)); return;
      } catch (e) { if (e.name === 'AbortError') return; }
    }
    const name = prompt(t('filePrompt'), fileName);
    if (!name || !name.trim()) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([raw], { type: name.includes('.') ? 'application/json' : 'application/octet-stream' }));
    a.download = fileName = name.trim(); a.click(); URL.revokeObjectURL(a.href);
  }
  $('save').onclick = () => {
    if (!applyText()) return;
    if (empty) return setStatus(t('noSave'));
    const raw = view === 'text' ? textEl.value : serialize(data);
    saveFile(raw);
  };
  $('copy').onclick = async () => {
    if (!applyText()) return;
    if (empty) return setStatus(t('noCopy'));
    try { await navigator.clipboard.writeText(serialize(data)); setStatus(t('copied')); }
    catch { textEl.select(); document.execCommand('copy'); setStatus(t('copied')); }
  };
  $('selAll').onclick = () => { // select the raw JSON; tree view switches to text view first
    if (view === 'tree') { if (!applyText()) return; showText(); }
    textEl.focus(); textEl.select();
  };
  $('undo').onclick = undo; $('redo').onclick = redo;

  // drag & drop
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (f) { const dt = new DataTransfer(); dt.items.add(f); $('file').files = dt.files; $('file').onchange({ target: $('file') }); }
  });

  // search wiring
  $('q').addEventListener('input', () => runSearch(false));
  for (const id of ['optKey', 'optVal', 'optCase', 'optRe']) $(id).onchange = () => runSearch(false);
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); step(e.shiftKey ? -1 : 1); } });
  $('next').onclick = () => step(1); $('prev').onclick = () => step(-1);

  addEventListener('keydown', e => {
    const inField = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); $('q').focus(); $('q').select(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); $('save').click(); }
    else if (!inField && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (!inField && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    else if (e.key === 'F3') { e.preventDefault(); step(e.shiftKey ? -1 : 1); }
  });

  afterChange();
  showText();
})();
</script>
</body>
</html>
